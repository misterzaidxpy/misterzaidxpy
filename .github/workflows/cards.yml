name: Refresh stat cards

# Card services get rate limited when GitHub's image proxy fetches them, and the
# proxy then caches the broken image. Generating the SVGs here avoids that.

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

jobs:
  cards:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_cards.py "${{ github.repository_owner }}" assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh stat cards"
            git push
          fi
